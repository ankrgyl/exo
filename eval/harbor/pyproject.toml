[project]
name = "exo-harbor"
version = "0.1.0"
description = "Harbor external-agent integration for Exo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["filelock>=3.29", "harbor>=0.20,<0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exo_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
